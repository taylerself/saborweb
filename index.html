<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SaborWeb · Livro de receitas</title>
    <link rel="icon" href="imagens/marca.svg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header hidden>
      <div class="bar">
        <a href="#/perfil" aria-label="Abrir perfil" class="avatar"
          ><img src="imagens/avatar.svg" alt=""
        /></a>
        <b>SaborWeb</b>
        <div id="tools">
          <a class="icon" href="#/busca" aria-label="Busca"
            ><img src="imagens/busca.svg" alt=""
          /></a>
          <a class="icon" href="#/notificacoes" aria-label="Notificações"
            ><img src="imagens/notificacoes.svg" alt=""
          /></a>
          <a class="icon" href="#/sair" aria-label="Sair"
            ><img src="imagens/sair.svg" alt=""
          /></a>
        </div>
      </div>
    </header>
    <small class="net" role="status" id="net"></small>
    <main id="main" tabindex="-1"></main>
    <nav hidden aria-label="Menu principal">
      <a href="#/inicio"><img src="imagens/inicio.svg" alt="" />Início</a>
      <a href="#/listas"><img src="imagens/listas.svg" alt="" />Receitas</a>
      <a href="#/publicar"><img src="imagens/publicar.svg" alt="" />Publicar</a>
      <a href="#/comunidade"
        ><img src="imagens/comunidade.svg" alt="" />Comunidade</a
      >
      <a href="#/perfil"><img src="imagens/perfil.svg" alt="" />Perfil</a>
    </nav>
    <p id="notice" role="status"></p>
    <p id="problem" role="alert"></p>
    <template id="login">
      <div class="login">
        <div class="cover">
          <img src="imagens/marca.svg" alt="" />
          <b>SaborWeb</b><span>Livro de receitas pessoal</span>
        </div>
        <form id="access">
          <h1>Entrar</h1>
          <p>Acesso de demonstração. Use uma senha fictícia.</p>
          <label
            >Usuário<input
              name="user"
              required
              autocomplete="username"
              autocapitalize="none"
          /></label>
          <label
            >Senha<input
              name="password"
              type="password"
              required
              autocomplete="current-password"
          /></label>
          <button>Entrar</button>
          <details>
            <summary>Dados do primeiro acesso</summary>
            <p>@MestrecucaA · Bomdeprato01</p>
          </details>
        </form>
      </div>
    </template>
    <template id="listas">
      <h1>Minhas listas</h1>
      <div id="cards" class="grid">
        <button id="createList" class="add">＋ Criar nova lista</button>
      </div>
    </template>
    <template id="lista">
      <a href="#/listas">← Minhas listas</a>
      <h1></h1>
      <button id="newRecipe">＋ Cadastrar receita</button>
      <div id="cards"></div>
    </template>
    <template id="receita">
      <a class="back"></a>
      <h1></h1>
      <button class="secondary" id="edit">Editar receita</button>
      <article>
        <h2>Ingredientes</h2>
        <ul></ul>
        <div id="mise">
          <h2>Mise en place</h2>
          <p></p>
        </div>
        <h2>Preparo</h2>
        <ol></ol>
      </article>
    </template>
    <template id="editor">
      <h1></h1>
      <form id="recipeForm">
        <label>Título<input name="title" required /></label>
        <fieldset>
          <legend>Ingredientes</legend>
          <div id="ingredients"></div>
          <button type="button" class="secondary" id="addIng">
            Adicionar ingrediente
          </button>
        </fieldset>
        <label>Mise en place (opcional)<textarea name="mise"></textarea></label>
        <fieldset>
          <legend>Etapas de preparo</legend>
          <div id="steps"></div>
          <button type="button" class="secondary" id="addStep">
            Adicionar etapa
          </button>
        </fieldset>
        <button>Salvar receita</button><a class="back">Cancelar</a>
      </form>
    </template>
    <template id="inicio">
      <h1>Início</h1>
      <section>
        <h2>Lembretes</h2>
        <form id="reminder">
          <label>Novo lembrete<input name="text" required /></label>
          <button>Adicionar lembrete</button>
        </form>
        <div id="notes"></div>
      </section>
      <section>
        <h2>Como usar o SaborWeb</h2>
        <table>
          <thead>
            <tr>
              <th>Ação</th>
              <th>Como fazer</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Criar lista</td>
              <td>Em Receitas, selecione Criar nova lista.</td>
            </tr>
            <tr>
              <td>Cadastrar receita</td>
              <td>Abra uma lista e selecione Cadastrar receita.</td>
            </tr>
            <tr>
              <td>Editar</td>
              <td>Use o lápis no cartão da receita.</td>
            </tr>
            <tr>
              <td>Consultar offline</td>
              <td>
                Aguarde “Disponível offline” e abra o site no mesmo navegador.
              </td>
            </tr>
          </tbody>
        </table>
      </section>
    </template>
    <template id="perfil">
      <h1>Meu perfil</h1>
      <form id="profile">
        <label
          >Usuário<input required name="user" autocomplete="username"
        /></label>
        <label
          >Data de nascimento (opcional)<input type="date" name="birth"
        /></label>
        <fieldset>
          <legend>Trocar senha</legend>
          <p>
            Use uma senha fictícia. Para manter a atual, deixe a nova senha em
            branco.
          </p>
          <label
            >Senha atual<input
              type="password"
              name="current"
              autocomplete="current-password"
          /></label>
          <label
            >Nova senha<input
              type="password"
              name="next"
              autocomplete="new-password"
          /></label>
          <label
            >Confirmar nova senha<input
              type="password"
              name="confirm"
              autocomplete="new-password"
          /></label>
        </fieldset>
        <button>Salvar perfil</button>
      </form>
    </template>
    <template id="notificacoes">
      <h1>Notificações</h1>
      <section>Nenhuma notificação no momento</section>
    </template>
    <template id="dev">
      <section class="empty">
        <h1>Funcionalidade em desenvolvimento</h1>
        <p>Em breve</p>
      </section>
    </template>
    <template id="ingredient">
      <div class="row ingredient">
        <label>Ingrediente<input name="nome" required /></label>
        <label>Quantidade<input name="quantidade" required /></label>
        <label>Unidade<input name="unidade" required /></label>
        <label class="check"
          ><input name="aGosto" type="checkbox" /> A gosto</label
        >
        <button type="button" class="secondary">Remover ingrediente</button>
      </div>
    </template>
    <template id="step">
      <div class="row">
        <label
          >Etapa de preparo<textarea name="etapa" required></textarea>
        </label>
        <button type="button" class="secondary">Remover etapa</button>
      </div>
    </template>
    <template id="card">
      <div class="card">
        <a></a><button class="icon" type="button"><img alt="" /></button>
      </div>
    </template>
    <template id="note">
      <div class="card">
        <label class="check"><input type="checkbox" /><span></span></label>
        <button class="secondary" type="button">Excluir</button>
      </div>
    </template>
    <dialog>
      <form id="listForm">
        <h2></h2>
        <label>Nome da lista<input name="name" required /></label>
        <p id="detail"></p>
        <div class="actions">
          <button type="button" class="secondary" id="cancel">Cancelar</button>
          <button id="confirmList"></button>
        </div>
      </form>
    </dialog>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
